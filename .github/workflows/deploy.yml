name: Build and deploy Next.js to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # Content edited in the dashboard is live immediately (pages read Supabase in
  # the browser). The nightly rebuild refreshes the copy baked into the HTML,
  # which search engines and visitors without JavaScript see.
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read Pages hosting configuration
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Type check
        run: npm run typecheck
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path || '' }}
          # Repository variables (Settings → Secrets and variables → Actions →
          # Variables). Both are public by design; never add a secret key here.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Check exported links and assets
        run: npm run check:export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path || '' }}
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
